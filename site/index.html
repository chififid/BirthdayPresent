<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5dce5"><title>Для тебя</title><link rel="stylesheet" href="./style.css"></head>
<body>
<canvas id="board" aria-label="Пульсирующее сердце из наших фотографий"></canvas>
<div class="vignette"></div>
<div id="skip-hold" hidden aria-hidden="true"><span>К портрету</span></div>
<button id="explore" disabled>Исследовать <span>↗</span></button>
<div id="explore-hint" hidden>Перетаскивай доску · Приближай колёсиком или двумя пальцами · Нажми на фото</div>
<nav id="explore-controls" hidden aria-label="Управление доской"><button id="back">← <span>К поздравлению</span></button><span class="divider"></span><button id="zoom-out" aria-label="Отдалить">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="Приблизить">+</button><button id="fit">Вся доска</button></nav>
<dialog id="viewer"><button id="close-viewer" aria-label="Закрыть фото">×</button><button id="prev" class="photo-nav" aria-label="Предыдущее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><div class="photo-wrap"><div class="photo-stage"><img id="full-photo" alt="Наше воспоминание"></div><span id="photo-position"></span></div><button id="next" class="photo-nav" aria-label="Следующее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></dialog>
<div id="error" hidden>Не удалось загрузить фотографии. <button onclick="location.reload()">Попробовать ещё раз</button></div>
<script type="module" src="./app.js"></script>
</body></html>
